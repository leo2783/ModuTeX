<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ModuTeX 新舊版前端操作與互動行為技術對比報告</title>
  <style>
    /* ==========================================================================
       CSS Variables & Theme Definitions (零外部依賴、純本地規範)
       ========================================================================== */
    :root {
      --bg-color: #FBFAF7;
      --text-main: #172033;
      --text-muted: #657085;
      --accent: #5BA8DF;
      --accent-hover: #4592C7;
      --card-bg: #FFFFFF;
      --card-accent: #DFF1FF;
      --card-border: #E2E8F0;
      --code-bg: #101828;
      --code-text: #F8FAFC;
      --code-border: #1E293B;
      --code-line-num: #475569;
      --tag-upgrade-bg: #E0F2FE;
      --tag-upgrade-text: #0369A1;
      --tag-flow-bg: #FEF3C7;
      --tag-flow-text: #B45309;
      --tag-new-bg: #DCFCE7;
      --tag-new-text: #15803D;
      --tag-unimpl-bg: #FEE2E2;
      --tag-unimpl-text: #B91C1C;
      --tag-removed-bg: #F1F5F9;
      --tag-removed-text: #475569;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }

    [data-theme="dark"] {
      --bg-color: #0B0F17;
      --text-main: #F1F5F9;
      --text-muted: #94A3B8;
      --accent: #38BDF8;
      --accent-hover: #0EA5E9;
      --card-bg: #151E2E;
      --card-accent: #1E293B;
      --card-border: #243247;
      --code-bg: #070B12;
      --code-text: #E2E8F0;
      --code-border: #1E293B;
      --code-line-num: #64748B;
      --tag-upgrade-bg: #0C4A6E;
      --tag-upgrade-text: #7DD3FC;
      --tag-flow-bg: #78350F;
      --tag-flow-text: #FDE68A;
      --tag-new-bg: #14532D;
      --tag-new-text: #86EFAC;
      --tag-unimpl-bg: #7F1D1D;
      --tag-unimpl-text: #FCA5A5;
      --tag-removed-bg: #334155;
      --tag-removed-text: #CBD5E1;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
    }

    /* Base Reset */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-sans);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    /* Container */
    .app-container {
      max-width: 1440px;
      margin: 0 auto;
      padding: 24px 20px 80px;
    }

    /* Header */
    header.hero-header {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 32px 36px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .hero-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
    }

    .hero-title h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .hero-title p {
      font-size: 15px;
      color: var(--text-muted);
      max-width: 860px;
      line-height: 1.5;
    }

    .hero-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    /* Controls Bar */
    .filter-panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      padding: 18px 24px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .filter-row-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .search-box {
      flex: 1;
      min-width: 260px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 10px 14px 10px 38px;
      font-size: 14px;
      border: 1px solid var(--card-border);
      border-radius: var(--radius-sm);
      background: var(--bg-color);
      color: var(--text-main);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-box input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(91, 168, 223, 0.2);
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
      font-size: 14px;
    }

    .select-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .select-group label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      white-space: nowrap;
    }

    select.filter-select {
      padding: 9px 14px;
      font-size: 13px;
      border: 1px solid var(--card-border);
      border-radius: var(--radius-sm);
      background: var(--bg-color);
      color: var(--text-main);
      cursor: pointer;
      outline: none;
    }

    select.filter-select:focus {
      border-color: var(--accent);
    }

    /* Dimension Tabs */
    .dim-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tab-btn {
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 500;
      border-radius: var(--radius-sm);
      border: 1px solid var(--card-border);
      background: var(--bg-color);
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .tab-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .tab-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #FFFFFF;
      font-weight: 600;
    }

    .tab-count {
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.08);
    }

    .tab-btn.active .tab-count {
      background: rgba(255, 255, 255, 0.25);
    }

    /* Actions toolbar */
    .stats-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: var(--text-muted);
      padding: 0 4px;
      margin-bottom: 16px;
    }

    .btn {
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 500;
      border-radius: var(--radius-sm);
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn-theme {
      background: var(--card-bg);
      color: var(--text-main);
    }

    /* Operations Cards Grid / List */
    .card-list {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .op-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .op-card:hover {
      border-color: rgba(91, 168, 223, 0.5);
      box-shadow: var(--shadow-md);
    }

    .op-card.is-expanded {
      border-color: var(--accent);
    }

    /* Card Header */
    .card-header {
      padding: 16px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
      background: transparent;
      gap: 16px;
      transition: background-color 0.15s;
    }

    .card-header:hover {
      background-color: rgba(91, 168, 223, 0.04);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .card-id-badge {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      background: var(--bg-color);
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid var(--card-border);
    }

    .card-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-main);
    }

    .header-badges {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .status-tag {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 12px;
      white-space: nowrap;
    }

    .status-upgrade { background: var(--tag-upgrade-bg); color: var(--tag-upgrade-text); }
    .status-flow { background: var(--tag-flow-bg); color: var(--tag-flow-text); }
    .status-new { background: var(--tag-new-bg); color: var(--tag-new-text); }
    .status-unimplemented { background: var(--tag-unimpl-bg); color: var(--tag-unimpl-text); }
    .status-removed { background: var(--tag-removed-bg); color: var(--tag-removed-text); }

    .dim-tag {
      font-size: 11px;
      color: var(--text-muted);
      background: var(--bg-color);
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid var(--card-border);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--text-muted);
      font-size: 14px;
    }

    .chevron {
      transition: transform 0.25s ease;
      display: inline-block;
    }

    .op-card.is-expanded .chevron {
      transform: rotate(180deg);
    }

    /* Card Body */
    .card-body {
      display: none;
      padding: 0 22px 24px;
      border-top: 1px solid var(--card-border);
      background: var(--card-bg);
    }

    .op-card.is-expanded .card-body {
      display: block;
    }

    /* 4-Section Grid */
    .section-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
      margin: 20px 0;
    }

    .section-item {
      background: var(--bg-color);
      padding: 14px 18px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--card-border);
    }

    .section-label {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .section-content {
      font-size: 13.5px;
      color: var(--text-main);
      line-height: 1.55;
    }

    .location-path {
      font-family: var(--font-mono);
      font-size: 12px;
      word-break: break-all;
      color: var(--text-muted);
    }

    /* Side-by-Side Code Evidence */
    .code-evidence-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
      margin: 20px 0 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .code-comparison-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .code-pane {
      background: var(--code-bg);
      border: 1px solid var(--code-border);
      border-radius: var(--radius-sm);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .code-pane-header {
      background: rgba(255, 255, 255, 0.04);
      border-bottom: 1px solid var(--code-border);
      padding: 8px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #94A3B8;
    }

    .pane-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
    }

    .pane-badge-new {
      background: #0284C7;
      color: #FFFFFF;
      padding: 1px 6px;
      border-radius: 3px;
      font-size: 10px;
    }

    .pane-badge-legacy {
      background: #475569;
      color: #FFFFFF;
      padding: 1px 6px;
      border-radius: 3px;
      font-size: 10px;
    }

    .pane-file-meta {
      font-family: var(--font-mono);
      font-size: 11px;
      color: #64748B;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 320px;
    }

    .pane-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .copy-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #E2E8F0;
      padding: 3px 8px;
      font-size: 11px;
      border-radius: 3px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .copy-btn:hover {
      background: rgba(255, 255, 255, 0.18);
      color: #FFFFFF;
    }

    .copy-btn.copied {
      background: #16A34A;
      color: #FFFFFF;
      border-color: #16A34A;
    }

    .code-view {
      padding: 12px;
      overflow-x: auto;
      font-family: var(--font-mono);
      font-size: 12.5px;
      line-height: 1.5;
      color: var(--code-text);
      max-height: 380px;
      overflow-y: auto;
    }

    .code-view table {
      border-collapse: collapse;
      width: 100%;
    }

    .code-view td {
      padding: 0;
      vertical-align: top;
      white-space: pre;
    }

    .line-number {
      width: 44px;
      min-width: 44px;
      user-select: none;
      text-align: right;
      padding-right: 14px;
      color: var(--code-line-num);
      font-size: 11px;
    }

    .line-content {
      color: var(--code-text);
    }

    /* Unimplemented Notice */
    .unimpl-notice {
      padding: 32px 20px;
      text-align: center;
      color: #94A3B8;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 100%;
    }

    .unimpl-badge {
      background: rgba(239, 68, 68, 0.2);
      color: #F87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 4px 12px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 12px;
    }

    /* Syntax Highlighting Tokens (本地安全高亮) */
    .tok-kw { color: #C678DD; font-weight: 600; }
    .tok-fn { color: #61AFEF; }
    .tok-str { color: #98C379; }
    .tok-num { color: #D19A66; }
    .tok-com { color: #5C6370; font-style: italic; }
    .tok-tex { color: #E5C07B; font-weight: 600; }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      background: var(--card-bg);
      border: 1px dashed var(--card-border);
      border-radius: var(--radius-md);
      color: var(--text-muted);
      display: none;
    }

    .empty-state h3 {
      font-size: 16px;
      margin-bottom: 6px;
      color: var(--text-main);
    }

    /* Responsive Adaptation (1440px 與 375px) */
    @media (max-width: 960px) {
      .hero-top {
        flex-direction: column;
      }
      .code-comparison-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 640px) {
      .app-container {
        padding: 16px 12px 60px;
      }
      header.hero-header {
        padding: 20px 18px;
      }
      .hero-title h1 {
        font-size: 20px;
      }
      .filter-panel {
        padding: 14px 16px;
      }
      .card-header {
        padding: 14px 16px;
      }
      .card-body {
        padding: 0 16px 18px;
      }
      .section-grid {
        grid-template-columns: 1fr;
      }
      .filter-row-top {
        flex-direction: column;
        align-items: stretch;
      }
      .search-box {
        width: 100%;
      }
      .dim-tabs {
        overflow-x: auto;
        padding-bottom: 4px;
        flex-wrap: nowrap;
      }
      .tab-btn {
        flex-shrink: 0;
      }
    }
  </style>
</head>
<body><aside role="note" style="padding:16px;margin:16px;border:2px solid #7a6524;background:#fff5d6;color:#332c18">歷史快照：2026-10-11。本文操作說明、程式碼片段與行號反映當時內容；目前 main 的狀態請見 <a href="../architecture/FRONTEND_REWRITE_STATUS.md">現行實作狀態</a>。</aside>
  <div class="app-container">
    <!-- Header -->
    <header class="hero-header">
      <div class="hero-top">
        <div class="hero-title">
          <h1>ModuTeX 新舊版前端操作與互動行為技術對比報告</h1>
          <p>
            全面對比 ModuTeX 新版前端（<code>apps/frontend</code>、<code>packages/document-core</code>、<code>packages/frontend-contracts</code>）與舊版前端（<code>apps/editor-legacy</code>）之真實原始碼實作，涵蓋 4 大操作維度、共計 36 項具體前端操作節點。

          </button>

      </div>

    <!-- Filters & Controls -->
    <section class="filter-panel" aria-label="過濾與搜尋面板">

            <option value="操作流程改變">操作流程改變</option>
            <option value="新版新增">新版新增</option>
            <option value="舊版具備但新版尚未實作">舊版具備但新版尚未實作</option>
            <option value="新版刻意移除">新版刻意移除</option>
          </select>

      <!-- Dimension Tabs -->
      <div class="dim-tabs" role="tablist">

        <button class="tab-btn" data-dim="維度 1：視覺化與原始碼編輯核心操作" role="tab" aria-selected="false">
          維度 1：核心編輯 <span class="tab-count">10</span>
        </button>
        <button class="tab-btn" data-dim="維度 2：數學公式與矩陣編輯操作" role="tab" aria-selected="false">
          維度 2：數學與矩陣 <span class="tab-count">7</span>

        <button class="tab-btn" data-dim="維度 3：表格、程式碼塊與圖表工具操作" role="tab" aria-selected="false">
          維度 3：表格與程式碼 <span class="tab-count">8</span>

        <button class="tab-btn" data-dim="維度 4：工作台、檔案系統與編譯預覽互動" role="tab" aria-selected="false">
          維度 4：工作台與編譯 <span class="tab-count">11</span>
        </button>
      </div>

    <!-- Stats and Batch Actions -->
    <div class="stats-bar">
      <div>
        顯示 <strong id="visible-count">36</strong> / 36 項具體操作項目
      </div>
      <div style="display: flex; gap: 8px;">
        <button class="btn" id="expand-all-btn">展開全部</button>
        <button class="btn" id="collapse-all-btn">收合全部</button>
      </div>

    <!-- Empty State -->
    <div class="empty-state" id="empty-state">

    <!-- Cards Container -->
    <main class="card-list" id="card-list"></main>
  </div>

  <!-- 引用外部資料集，同時具備自包含內嵌資料 fallback -->

, 'C', 'C', 'C'], ['cpp', 'C++', 'C++', 'C++'], ['json', 'JSON', 'JSON', ''],\n\t['bash', 'Shell', 'Shell', 'bash'], ['sql', 'SQL', 'SQL', 'SQL']\n] as const;\ntype CodeLanguage = readonly [string, string, string, string];\nconst primaryNames = new Set(PRIMARY_LANGUAGES.map(entry => entry[2]));\nexport const CODE_LANGUAGES: readonly CodeLanguage[] = [\n\t...PRIMARY_LANGUAGES,\n\t['wsl', 'Shell（WSL）', 'Shell (WSL)', 'bash'],\n\t...languages.filter(entry => !primaryNames.has(entry.name as never)).map(entry => [\n\t\tentry.name.toLowerCase().replaceAll('+', 'plus').replaceAll('#', 'sharp').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''), entry.name, entry.name, ''\n\t] as CodeLanguage)\n];\n\nexport function codeLanguage(language = 'text') {\n\tconst entry = CODE_LANGUAGES.find(entry => entry[0] === language);\n\tif (!entry) throw new Error('CODE_LANGUAGE');\n\treturn entry;\n}"},"legacyCode":{"file":"apps/editor-legacy/src/lib/editor/cmHighlight.ts","lineStart":1,"lineEnd":40,"lang":"typescript","isImplemented":true,"snippet":"// The one highlight style every CodeMirror in the app shares - source editor, raw islands, code\n// blocks, diff panel - so LaTeX, Markdown and Typst colour the same construct the same way.\n//\n// The palette is hand-picked PER MODE (GitHub Primer hues) instead of the old\n// defaultHighlightStyle-plus-auto-brightener: every colour here clears ~5:1 contrast on the light\n// surface and ~7:1 on the dark one, and each semantic role keeps the same hue family across modes\n// so a file reads the same in both. Swapped via a Compartment when the resolved mode changes.\nimport { Compartment, type Extension } from '@codemirror/state';\nimport { EditorView, ViewPlugin } from '@codemirror/view';\nimport { syntaxHighlighting, HighlightStyle } from '@codemirror/language';\nimport { tags, type Tag } from '@lezer/highlight';\nimport { get } from 'svelte/store';\nimport { resolvedMode } from '$lib/theme';\n\ninterface Role {\n\ttag: Tag | readonly Tag[];\n ral, tags.atom], light: '#953800', dark: '#ffa657' },\n\t// dark blue: strings\n\t{ tag: tags.string, light: '#0a3069', dark: '#a5d6ff' },\n\t// headings: bold in the DEFAULT text colour, all three dialects. The colour stays on the\n\t// marker (\\section, =, #): the title is the document's own text, not syntax\n\t{ tag: tags.heading, fontWeight: 'bold' },\n\t// url gets the colour; link is underline-ONLY because md's Link rule spans the whole link\n\t// subtree, text included - colouring it painted \"[Inline link]\" instead of just the URL\n\t{ tag: tags.url, light: '#0969da', dark: '#58a6ff', textDecoration: 'underline' },\n\t{ tag: tags.link, textDecoration: 'underline' },\n\t// amber: inline code / verbatim / raw\n\t{ tag: tags.monospace, light: '#7d4e00', dark: '#e3b341' },\n\t// pink: separators (\\\\, ---, linebreaks) and operators (&, ^, _)\n\t{ tag: [tags.contentSeparator, tags.operator], light: '#bf3989', dark: '#f778ba' },\n\t// font-only roles\n\t{ tag: tags.emphasis, fontStyle: 'italic' },\n\t{ tag: tags.strong, fontWeight: 'bold' },\n\t{ tag: tags.strikethrough, textDecoration: 'line-through' },\n\t// diffs and errors\n\t{ tag: tags.inserted, light: '#116329', dark: '#7ee787' },\n\t{ tag: [tags.deleted, tags.invalid], light: '#82071e', dark: '#ffa198' }\n];\n\nfunction specsFor(mode: 'light' | 'dark') {\n\treturn roles.map(({ tag, light, dark, fontWeight, fontStyle, textDecoration }) => {\n\t\tconst color = mode === 'dark' ? dark : light;\n\t\treturn {\n\t\t\ttag: tag as Tag | Tag[],\n\t\t\t...(color ? { color } : {}),\n\t\t\t...(fontWeight ? { fontWeight } : {}),"}},{"id":"op-23","dimension":"維度 3：表格、程式碼塊與圖表工具操作","name":"Code verbatim 逃逸與 1MB 上限","status":"操作升級/重構","definition":"防止程式碼內容破壞外層 LaTeX 環境之邊界過濾與容量上限防護機制。","location":"新版：apps/frontend/src/features/code/source.ts:50-65；舊版：apps/editor-legacy/src/lib/serializer/latexSerializer.ts:110-140","purpose":"新版設定 1MB 承載上限，偵測空字元立即報錯，檢測內含 \\end{verbatim} 或 \\end{lstlisting} 結束標記立即拋出 CODE_END_DELIMITER 拒絕序列 rksKey(nextMarks) !== key) break;\n\t\t\t\tj++;\n\t\t\t}\n\t\t}\n\t\tif (j === i + 1) {\n\t\t\tpieces.push(serializeNode(children[i], { parent: node, index: i, isLastChild: i === children.length - 1, inTableCell }));\n\t\t} else {\n\t\t\tlet inner = '';\n\t\t\tfor (let k = i; k < j; k++) inner += serializeBare(children[k]);\n\t\t\tpieces.push(applyMarks(inner, marks as readonly Mark[]));\n\t\t}\n\t\ti = j;\n\t}\n\n\tlet out = '';"}},{"id":"op-24","dimension":"維度 3：表格、程式碼塊與圖表工具操作","name":"Draw.io 圖表嵌入與訊息橋接","status":"舊版具備但新版尚未實作","definition":"在編輯器中內嵌 Draw.io 繪圖介面，透過安全 PostMessage 協議傳輸圖檔與重新關聯之流程。","location":"新版：packages/frontend-contracts/src/types.ts:94-110（合約層邊界，前端尚未實作）；舊版：apps/editor-legacy/src/lib/diagram/client.ts:18-35","purpose":"舊版建立隔離通訊工作階段，以 32 位元組隨機 Nonce 驗證來源，支援向量 SVG/PDF 匯出與 Relink 重新關聯。新版架構於合約與後端保留協定，前端操作介面尚未實作。","edgeCases":"舊版通訊設有超時時限，iframe 重複導航立即中斷工作階段；檔案大小限制為 10MB。","newCode":{"file":"packages/frontend-contracts/src/types.ts","lineStart":94,"lineEnd":110,"lang":"typescript","isImplemented":false,"snippet":"export interface DesktopPort {\n\topenWorkspace(kind: 'folder' | 'file'): Promise<WorkspaceInfo | null>;\n\tlistRecent(): Promise<readonly RecentDocument[]>;\n\topenRecent(id: string): Promise<WorkspaceInfo>;\n\tremoveRecent(id: string): Promise<void>;\n\tlistFiles(workspaceId: string): Promise<readonly FileEntry[]>;\n\treadFile(file: FileRef): Promise<ReadReceipt>;\n\twriteFile(request: WriteRequest): Promise<WriteReceipt>;\n\tsaveAs(request: SaveAsRequest): Promise<SaveAsReceipt | null>;\n\twatchFiles(\n\t\tworkspaceId: string,\n\t\tlistener: (event: FileEvent) => void,\n\t\tonError?: (failure: FileWatchFailure) => void\n\t): Promise<Unsubscribe>;\n\tcompile(request: CompileRequest): Promise<CompileHandle>;\n\tcloseWorkspace(workspaceId: string): Promise<void>;\n}"},"legacyCode":{"file":"apps/editor-legacy/src/lib/diagram/client.ts","lineStart":18,"lineEnd":35,"lang":"typescript","isImplemented":true,"snippet":"export interface DiagramBridge {     function escapeHtml(text) {
      if (!text) return '';
      return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');

    function highlightSyntax(code) {
      if (!code) return '';
      var lines = code.split('\n');
      return lines.map(function(line) {
        var escaped = escapeHtml(line);
        // Comments
        if (/^(\s*)(\/\/|%|#)(.*)$/.test(escaped)) {
          return escaped.replace(/^(\s*)(\/\/|%|#)(.*)$/, '$1<span class="tok-com">$2$3</span>');
        }
        // Strings ('...', "...", `...`)
        escaped = escaped.replace(/(['"`])(?:\\.|(?!\1)[^\\\r\n])*\1/g, '<span class="tok-str">$&</span>');
        // LaTeX Macros
        escaped = escaped.replace(/(\\[a-zA-Z@]+)/g, '<span class="tok-tex">$1</span>');
        // Keywords
        var kwRegex = /\b(const|let|var|function|return|if|else|for|while|import|export|from|class|extends|new|try|catch|finally|throw|typeof|instanceof|default|switch|case|break|continue|null|undefined|true|false|async|await|interface|type)\b/g;

          '      <div class="code-view code-snippet code-comparison side-by-side">',
          '        <pre class="code-snippet code-comparison side-by-side">' + renderCodeTable(legacyCodeSnippet, item.legacyCode.lineStart) + '</pre>',
          '      </div>',
          '    </div>',
          '  </div>',
          '</div>'
        ].join('\n');

        card.innerHTML = html;

        var header = card.querySelector('.card-header');
        var toggleCard = function() {
          var isExpanded = card.classList.toggle('is-expanded');
          header.setAttribute('aria-expanded', isExpanded ? 'true' : 'false');
        };
        header.addEventListener('click', toggleCard);
        header.addEventListener('keydown', function(e) {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            toggleCard();
          }
        });

        var copyBtns = card.querySelectorAll('.copy-btn');
        copyBtns.forEach(function(btn) {
          btn.addEventListener('click', function(e) {
            e.stopPropagation();
            var target = btn.dataset.copy === 'new' ? newCodeSnippet : legacyCodeSnippet;
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(target).then(function() {
                var originalText = btn.textContent;
                btn.textContent = '已複製！';
                btn.classList.add('copied');
                setTimeout(function() {
                  btn.textContent = originalText;
                  btn.classList.remove('copied');
                }, 2000);
              });
            }
          });
        });

        return card;
      }

      function initCards() {
        cardList.innerHTML = '';
        data.items.forEach(function(item) {
          cardList.appendChild(renderCard(item));
        });
        filterItems();
      }

      function filterItems() {
        var query = searchQuery.trim().toLowerCase();
        var visibleCount = 0;
        var cards = cardList.querySelectorAll('.op-card');

        cards.forEach(function(card) {
          var id = card.dataset.id;
          var dim = card.dataset.dim;
          var status = card.dataset.status;
          var item = data.items.find(function(i) { return i.id === id; });

          var matchesDim = currentDim === 'all' || dim === currentDim;
          var matchesStatus = currentStatus === 'all' || status === currentStatus;

          var matchesSearch = true;
          if (query) {
            var searchable = [
              item.name,
              item.definition,
              item.purpose,
              item.edgeCases,
              item.location,
              item.newCode.file,
              item.legacyCode.file,
              item.newCode.snippet,
              item.legacyCode.snippet
            ].join(' ').toLowerCase();
            matchesSearch = searchable.indexOf(query) !== -1;
          }

          if (matchesDim && matchesStatus && matchesSearch) {
            card.style.display = 'block';
            visibleCount++;
          } else {
            card.style.display = 'none';
          }
        });

        visibleCountEl.textContent = visibleCount;
        emptyStateEl.style.display = visibleCount === 0 ? 'block' : 'none';
      }

      dimTabs.forEach(function(tab) {
        tab.addEventListener('click', function() {
          dimTabs.forEach(function(t) {
            t.classList.remove('active');
            t.setAttribute('aria-selected', 'false');
          });
          tab.classList.add('active');
          tab.setAttribute('aria-selected', 'true');
          currentDim = tab.dataset.dim;
          filterItems();
        });
      });

      statusFilter.addEventListener('change', function(e) {
        currentStatus = e.target.value;
        filterItems();
      });

      searchInput.addEventListener('input', function(e) {
        searchQuery = e.target.value;
        filterItems();
      });

      expandAllBtn.addEventListener('click', function() {
        var cards = cardList.querySelectorAll('.op-card');
        cards.forEach(function(card) {
          if (card.style.display !== 'none') {
            card.classList.add('is-expanded');
            card.querySelector('.card-header').setAttribute('aria-expanded', 'true');
          }
        });
      });

      collapseAllBtn.addEventListener('click', function() {
        var cards = cardList.querySelectorAll('.op-card');
        cards.forEach(function(card) {
          card.classList.remove('is-expanded');
          card.querySelector('.card-header').setAttribute('aria-expanded', 'false');
        });
      });

      function toggleTheme() {
        var root = document.documentElement;
        var isDark = root.getAttribute('data-theme') === 'dark';
        var nextTheme = isDark ? 'light' : 'dark';
        root.setAttribute('data-theme', nextTheme);
        themeIcon.textContent = isDark ? '🌙' : '☀️';
        themeText.textContent = isDark ? '深色模式' : '淺色模式';
        try { localStorage.setItem('modutex-theme', nextTheme); } catch (e) {}
      }

      themeToggleBtn.addEventListener('click', toggleTheme);

      try {
        var savedTheme = localStorage.getItem('modutex-theme');
        if (savedTheme) {
          document.documentElement.setAttribute('data-theme', savedTheme);
          themeIcon.textContent = savedTheme === 'dark' ? '☀️' : '🌙';
          themeText.textContent = savedTheme === 'dark' ? '淺色模式' : '深色模式';
        }
      } catch (e) {}

      initCards();
    })();
  </script>
</body>
</html>
