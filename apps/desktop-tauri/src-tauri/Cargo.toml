[package]
name = "modutex-desktop-tauri"
version = "0.2.1"
description = "ModuTeX Tauri desktop host"
license = "Apache-2.0"
edition = "2021"
publish = false

[lib]
name = "modutex_desktop_tauri_lib"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = "=2.7.3"

[dependencies]
tauri = "=2.12.4"
tauri-plugin-dialog = "=2.8.3"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
uuid = { version = "=1.18.1", features = ["v4", "serde"] }
