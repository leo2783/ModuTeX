name: Feature request
description: Request a new feature
body:
  - type: markdown
    attributes:
      value: |
        Describe the feature and the problem it would solve.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: The feature you would like, and the problem it solves.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: How you currently work around this, if at all.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that helps, such as screenshots or examples from other editors.
