name: Tauri CI - Maintained Markdown
on:
  workflow_call:
    inputs:
      checkout_ref:
        description: Validated full source commit SHA from source admission.
        required: true
        type: string
permissions:
  actions: read
  contents: read
defaults:
  run:
    shell: pwsh
jobs:
  markdown-format:
    name: Markdown formatting
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout verified source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.checkout_ref }}
          persist-credentials: false
          fetch-depth: 1
      - name: Setup Node.js 24.22.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Verify Node and npm runtime versions
        run: |
          test "$(node --version)" = 'v24.22.1'
          test "$(npm --version)" = '11.19.1'
      - name: Install pinned project tools
        run: npm ci --ignore-scripts
      - name: Check maintained project Markdown with pinned Prettier
        run: |
          mapfile -d '' -t markdown_files < <(git ls-files -z -- \
            ':(icase)*.md' \
            ':(exclude,glob)docs/archive/**' \
            ':(exclude,glob)docs/history/**' \
            ':(exclude,glob)docs/historical/**' \
            ':(exclude,glob)docs/legacy/**' \
            ':(exclude,glob)docs/agents/**' \
            ':(exclude,glob)docs/**/AGENTS.md' \
            ':(exclude,glob)docs/**/agent-rules/**' \
            ':(exclude,glob)**/vendor/**' \
            ':(exclude,glob)**/LICENSE*.md' \
            ':(exclude,glob)**/NOTICE*.md' \
            ':(exclude,glob)**/THIRD_PARTY_NOTICES.md')
          npm exec --no -- prettier --check "${markdown_files[@]}"
