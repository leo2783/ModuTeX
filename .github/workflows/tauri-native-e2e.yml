name: Tauri CI - Native Windows E2E
on:
  workflow_call:
    inputs:
      frontend_artifact_name:
        description: Exact artifact name emitted by the frontend producer job.
        required: true
        type: string
      checkout_ref:
        description: Validated full source commit SHA from source admission.
        required: true
        type: string
      package_version:
        description: Package version verified by source admission.
        required: true
        type: string
      built_exe_sha256:
        description: SHA-256 of the accepted release executable.
        required: true
        type: string
      built_exe_artifact_id:
        description: Artifact ID of the accepted release executable.
        required: true
        type: string
      built_exe_artifact_name:
        description: Artifact name of the accepted release executable.
        required: true
        type: string
      built_exe_artifact_run_id:
        description: Workflow run ID containing the accepted executable.
        required: true
        type: string
      built_exe_artifact_digest:
        description: Artifact digest of the accepted executable upload.
        required: true
        type: string
      built_exe_workflow_sha:
        description: Workflow source SHA associated with the executable.
        required: true
        type: string
      built_exe_source_commit:
        description: Source commit used to build the executable.
        required: true
        type: string
      built_exe_package_version:
        description: Package version associated with the executable.
        required: true
        type: string
permissions:
  actions: read
  contents: read
defaults:
  run:
    shell: pwsh
jobs:
  native-e2e:
    name: Native Windows WebView E2E (${{ matrix.lane }})
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      MODUTEX_TEST_CDP_PORT: '9222'
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: g2-workbench
            script: tests/scripts/tauri-g2-workbench-e2e.mjs
          - lane: g4-files
            script: tests/scripts/tauri-g4-files-e2e.mjs
          - lane: g4-terminal
            script: tests/scripts/tauri-g4-terminal-e2e.mjs
          - lane: compile-config
            script: tests/scripts/tauri-compile-config-e2e.mjs
          - lane: close
            script: tests/scripts/tauri-native-close-e2e.mjs
          - lane: multiwindow
            script: tests/scripts/tauri-multiwindow-e2e.mjs
          - lane: os-open
            script: tests/scripts/tauri-os-open-e2e.mjs
    steps:
      - name: Checkout verified source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.checkout_ref }}
          persist-credentials: false
          fetch-depth: 1
      - name: Setup Node.js 24.22.1
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Verify Node and npm runtime versions
        run: |
          if ((node --version) -ne 'v24.22.1') { throw 'Node.js 24.22.1 required' }
          if ((npm --version) -ne '11.19.1') { throw 'npm 11.19.1 required' }
      # Tauri needs the Evergreen Runtime to create its real WebView; the lane
      # still launches the accepted executable and checks its actual CDP endpoint.
      - name: Provision and verify Microsoft Edge WebView2 Runtime
        run: |
          $ErrorActionPreference = 'Stop'
          # Microsoft-supported Evergreen detection, including per-user registration.
          # https://learn.microsoft.com/microsoft-edge/webview2/concepts/distribution
          function Find-WebView2Runtime {
            $client = '{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
            $keys = @(
              "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\$client",
              "HKCU:\Software\Microsoft\EdgeUpdate\Clients\$client"
            )
            foreach ($key in $keys) {
              $value = Get-ItemPropertyValue -LiteralPath $key -Name 'pv' -ErrorAction SilentlyContinue
              $version = $null
              if ([version]::TryParse([string]$value, [ref]$version) -and $version -gt [version]'0.0.0.0') {
                return [pscustomobject]@{ Version = $version; Registration = $key }
              }
            }
            return $null
          }

          $runtime = Find-WebView2Runtime
          if (-not $runtime) {
            # Official Microsoft Evergreen Bootstrapper.
            $installer = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebView2Setup.exe'
            Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' `
              -OutFile $installer -TimeoutSec 120
            if (-not (Test-Path -LiteralPath $installer -PathType Leaf) -or
                (Get-Item -LiteralPath $installer).Length -le 0) {
              throw 'Microsoft WebView2 bootstrapper download is missing or empty'
            }

            $signature = Get-AuthenticodeSignature -FilePath $installer
            if ([string]$signature.Status -ne 'Valid' -or $null -eq $signature.SignerCertificate) {
              throw 'Microsoft WebView2 bootstrapper signature is not valid'
            }
            $publisher = $signature.SignerCertificate.GetNameInfo(
              [System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false)
            if ($publisher -ne 'Microsoft Corporation') {
              throw "Unexpected WebView2 bootstrapper publisher: $publisher"
            }

            $install = Start-Process -FilePath $installer -ArgumentList @('/silent', '/install') `
              -WindowStyle Hidden -Wait -PassThru
            if ($install.ExitCode -ne 0) {
              throw "Microsoft WebView2 Runtime installation failed with exit code $($install.ExitCode)"
            }
            $runtime = Find-WebView2Runtime
          }

          if (-not $runtime) {
            throw 'Microsoft Edge WebView2 Evergreen Runtime is unavailable after provisioning'
          }
          Write-Host "Verified Microsoft Edge WebView2 Runtime $($runtime.Version) registered at $($runtime.Registration)"
      - name: Install E2E dependencies
        run: npm ci --ignore-scripts
      - name: Prepare clean native E2E artifact destinations
        run: |
          $dist = 'apps/frontend/dist-tauri'
          if (Test-Path -LiteralPath $dist) { Remove-Item -LiteralPath $dist -Recurse -Force }
          $targetExe = 'apps/desktop-tauri/target/x86_64-pc-windows-msvc/release/modutex-desktop-tauri.exe'
          if (Test-Path -LiteralPath $targetExe) { Remove-Item -LiteralPath $targetExe -Force }
          $releaseExe = 'apps/desktop-tauri/target/release/modutex-desktop-tauri.exe'
          if (Test-Path -LiteralPath $releaseExe) { Remove-Item -LiteralPath $releaseExe -Force }
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $targetExe) -ErrorAction Stop | Out-Null
      - name: Download frontend assets built for this run
        env:
          GH_TOKEN: ${{ github.token }}
          FRONTEND_ARTIFACT_NAME: ${{ inputs.frontend_artifact_name }}
        run: |
          $staging = Join-Path $env:RUNNER_TEMP ("modutex-frontend-" + [guid]::NewGuid().ToString('N'))
          if (Test-Path -LiteralPath $staging) { throw 'Frontend artifact staging path already exists' }
          New-Item -ItemType Directory -Path $staging -ErrorAction Stop | Out-Null
          & ./tests/scripts/helpers/download-workflow-artifact.ps1 -RunId $env:GITHUB_RUN_ID -ArtifactName $env:FRONTEND_ARTIFACT_NAME -Destination $staging
          if ($LASTEXITCODE -ne 0) { throw "Failed to download frontend artifact $env:FRONTEND_ARTIFACT_NAME" }
          $artifactDist = Join-Path $staging 'apps/frontend/dist-tauri'
          $index = Join-Path $artifactDist 'index.html'
          if (-not (Test-Path -LiteralPath $index -PathType Leaf) -or (Get-Item -LiteralPath $index).Length -le 0) {
            throw 'Native E2E frontend artifact did not contain a nonempty apps/frontend/dist-tauri/index.html'
          }
          $targetDist = 'apps/frontend/dist-tauri'
          New-Item -ItemType Directory -Path $targetDist -ErrorAction Stop | Out-Null
          Get-ChildItem -LiteralPath $artifactDist -Force |
            Copy-Item -Destination $targetDist -Recurse -Force -ErrorAction Stop
      - name: Verify and download the exact release executable artifact
        env:
          GH_TOKEN: ${{ github.token }}
          EXE_ARTIFACT_ID: ${{ inputs.built_exe_artifact_id }}
          EXE_ARTIFACT_NAME: ${{ inputs.built_exe_artifact_name }}
          EXE_ARTIFACT_RUN_ID: ${{ inputs.built_exe_artifact_run_id }}
          EXE_ARTIFACT_DIGEST: ${{ inputs.built_exe_artifact_digest }}
          EXE_WORKFLOW_SHA: ${{ inputs.built_exe_workflow_sha }}
          EXPECTED_EXE_SHA: ${{ inputs.built_exe_sha256 }}
          EXPECTED_SOURCE_COMMIT: ${{ inputs.checkout_ref }}
          EXPECTED_PACKAGE_VERSION: ${{ inputs.package_version }}
          EXE_SOURCE_COMMIT: ${{ inputs.built_exe_source_commit }}
          EXE_PACKAGE_VERSION: ${{ inputs.built_exe_package_version }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: >
          if ($env:EXE_ARTIFACT_ID -notmatch '^\d+$') { throw 'Executable artifact ID is invalid' }

          if ($env:EXE_ARTIFACT_NAME -ne 'ModuTeX-Release-Executable') { throw 'Executable artifact name mismatch' }

          if ($env:EXE_ARTIFACT_RUN_ID -ne $env:CURRENT_RUN_ID) { throw 'Executable artifact belongs to another workflow
          run' }

          if ($env:EXPECTED_EXE_SHA -notmatch '^[0-9a-f]{64}$') { throw 'Verified executable SHA-256 is invalid' }

          if (-not [string]::Equals($env:EXPECTED_SOURCE_COMMIT, $env:EXE_SOURCE_COMMIT,
          [System.StringComparison]::Ordinal)) { throw 'Executable source commit differs from verified source identity'
          }

          if (-not [string]::Equals($env:EXPECTED_PACKAGE_VERSION, $env:EXE_PACKAGE_VERSION,
          [System.StringComparison]::Ordinal)) { throw 'Executable version differs from verified package version' }

          $expectedDigest = $env:EXE_ARTIFACT_DIGEST.ToLowerInvariant()

          if ($expectedDigest -notmatch '^(sha256:)?[0-9a-f]{64}$') { throw 'Executable artifact digest is invalid' }

          if (-not $expectedDigest.StartsWith('sha256:')) { $expectedDigest = "sha256:$expectedDigest" }

          $artifactJson = gh api "repos/$env:GITHUB_REPOSITORY/actions/artifacts/$env:EXE_ARTIFACT_ID"

          if ($LASTEXITCODE -ne 0) { throw 'Failed to retrieve executable artifact metadata' }

          $artifact = $artifactJson | ConvertFrom-Json

          if ([string]$artifact.id -ne $env:EXE_ARTIFACT_ID) { throw 'Executable artifact ID differs from the verified
          build output' }

          if ($artifact.name -ne $env:EXE_ARTIFACT_NAME) { throw 'Executable artifact metadata name mismatch' }

          if ($artifact.expired -ne $false -or $artifact.size_in_bytes -le 0) { throw 'Executable artifact is expired or
          empty' }

          if ($artifact.digest.ToLowerInvariant() -ne $expectedDigest) { throw 'Executable artifact digest differs from
          the verified build output' }

          if ([string]$artifact.workflow_run.id -ne $env:EXE_ARTIFACT_RUN_ID) { throw 'Executable artifact workflow run
          mismatch' }

          if ($artifact.workflow_run.head_sha -ne $env:EXE_WORKFLOW_SHA) { throw 'Executable artifact workflow source
          SHA mismatch' }

          $destDir = 'apps/desktop-tauri/target/x86_64-pc-windows-msvc/release'

          New-Item -ItemType Directory -Force -Path $destDir -ErrorAction Stop | Out-Null

          & ./tests/scripts/helpers/download-workflow-artifact.ps1 -RunId $env:EXE_ARTIFACT_RUN_ID -ArtifactName $env:EXE_ARTIFACT_NAME -Destination $destDir

          if ($LASTEXITCODE -ne 0) { throw 'Failed to download the release executable artifact from this run' }

          $exe = Join-Path $destDir 'modutex-desktop-tauri.exe'

          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'Downloaded release executable is missing' }

          $actualSha = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()

          if ($actualSha -ne $env:EXPECTED_EXE_SHA) { throw 'Downloaded executable differs from the tested build output'
          }
      - name: Verify executable identity and stage for native E2E
        env:
          EXPECTED_SOURCE_COMMIT: ${{ inputs.checkout_ref }}
          EXPECTED_EXE_SHA: ${{ inputs.built_exe_sha256 }}
          EXPECTED_PACKAGE_VERSION: ${{ inputs.package_version }}
        run: |
          $commit = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Source revision unavailable' }
          if ($commit -ne $env:EXPECTED_SOURCE_COMMIT) { throw 'Native E2E checked out an unexpected source commit' }
          $exe = 'apps/desktop-tauri/target/x86_64-pc-windows-msvc/release/modutex-desktop-tauri.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'Downloaded release executable is missing' }
          $actualSha = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha -ne $env:EXPECTED_EXE_SHA.ToLowerInvariant()) {
            throw "Native E2E executable SHA-256 ($actualSha) differs from build output ($env:EXPECTED_EXE_SHA)"
          }
          $releaseExe = 'apps/desktop-tauri/target/release/modutex-desktop-tauri.exe'
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $releaseExe) -ErrorAction Stop | Out-Null
          Copy-Item -LiteralPath $exe -Destination $releaseExe -Force -ErrorAction Stop
      - name: Verify downloaded Tauri frontend assets
        run: |
          $dist = 'apps/frontend/dist-tauri'
          if (-not (Test-Path -LiteralPath $dist -PathType Container)) {
            throw 'Native E2E frontend artifact did not contain apps/frontend/dist-tauri'
          }
          if (@(Get-ChildItem -LiteralPath $dist -File -Recurse).Count -eq 0) {
            throw 'Native E2E frontend artifact is empty'
          }
      - name: Prepare native E2E evidence directory
        run: |
          $evidence = Join-Path $env:GITHUB_WORKSPACE '.verification-artifacts/tauri'
          New-Item -ItemType Directory -Force -Path $evidence -ErrorAction Stop | Out-Null
          if (-not (Test-Path -LiteralPath $evidence -PathType Container)) {
            throw 'Could not create native E2E evidence directory'
          }
      - name: Configure app-scoped WebView2 CDP policy
        id: webview2-cdp-policy
        run: pwsh -NoProfile -File tests/scripts/helpers/webview2-cdp-policy.ps1 -Action Configure
      - name: Prepare compiled owned-dialog interop before starting the app
        timeout-minutes: 1
        run: |
          $assembly = Join-Path $env:RUNNER_TEMP ("modutex-owned-popups-" + [guid]::NewGuid().ToString('N') + '.dll')
          & ./tests/scripts/helpers/owned-native-popups.ps1 -OutputAssembly $assembly
          if (-not (Test-Path -LiteralPath $assembly -PathType Leaf) -or (Get-Item -LiteralPath $assembly).Length -le 0) {
            throw 'Owned-dialog interop assembly was not prepared'
          }
          "MODUTEX_TEST_NATIVE_POPUPS_ASSEMBLY=$assembly" >> $env:GITHUB_ENV
      - name: Prewarm Tectonic for compile-config E2E
        if: matrix.lane == 'compile-config'
        timeout-minutes: 12
        run: |
          $ErrorActionPreference = 'Stop'
          . ./tests/scripts/helpers/ci-bounded-process.ps1

          $script:CiProcessDeadline = [DateTime]::UtcNow.AddSeconds(650)

          $tectonic = (Resolve-Path 'vendor/tectonic/windows-x64/tectonic.exe').Path
          $root = Join-Path $env:RUNNER_TEMP ('modutex-tectonic-prewarm-' + [guid]::NewGuid().ToString('N'))
          $logs = Join-Path $env:GITHUB_WORKSPACE '.verification-artifacts/tauri'
          New-Item -ItemType Directory -Force -Path $root, $logs | Out-Null

          $source = Join-Path $root 'prewarm.tex'
          @'
          \documentclass{article}
          \usepackage{amsmath}
          \usepackage[top=1.5cm,bottom=2.5cm,left=3cm,right=4cm]{geometry}
          \begin{document}
          Real Tectonic prewarm.
          \[
          \frac{\partial^2 f}{\partial x^2}
          \]
          \end{document}
          '@ | Set-Content -LiteralPath $source -Encoding utf8

          if (-not $env:LOCALAPPDATA) {
            throw 'LOCALAPPDATA is required for the managed Tectonic cache'
          }

          $managedCache = Join-Path $env:LOCALAPPDATA 'io.github.leo2783.modutex.tauri/tectonic'
          $modes = @(
            @{ Name = 'managed'; Cache = $managedCache },
            @{ Name = 'custom'; Cache = $null }
          )

          foreach ($mode in $modes) {
            if ($mode.Cache) {
              $env:TECTONIC_CACHE_DIR = $mode.Cache
            } else {
              Remove-Item Env:TECTONIC_CACHE_DIR -ErrorAction SilentlyContinue
            }

            $output = Join-Path $root "output-$($mode.Name)"
            New-Item -ItemType Directory -Force -Path $output | Out-Null

            $success = $false

            for ($attempt = 1; $attempt -le 3; $attempt++) {
              $log = Join-Path $logs "tectonic-prewarm-$($mode.Name)-$attempt.log"
              Write-Host "[Tectonic] $($mode.Name) attempt $attempt"

              try {
                Invoke-CiBoundedProcess `
                  -FilePath $tectonic `
                  -Arguments @(
                    '--untrusted',
                    '--keep-logs',
                    '--synctex',
                    '--outdir',
                    $output,
                    $source
                  ) `
                  -LogPath $log `
                  -PortableRoot $root `
                  -TimeoutSeconds 150 | Out-Null

                $pdf = Join-Path $output 'prewarm.pdf'
                if (-not (Test-Path -LiteralPath $pdf -PathType Leaf)) {
                  throw 'Tectonic prewarm produced no PDF'
                }

                $bytes = [System.IO.File]::ReadAllBytes($pdf)
                if ($bytes.Length -lt 5 -or
                    [System.Text.Encoding]::ASCII.GetString($bytes, 0, 5) -ne '%PDF-') {
                  throw 'Tectonic prewarm produced an invalid PDF'
                }

                $success = $true
                break
              } catch {
                Write-Warning "[Tectonic] $($mode.Name) attempt $attempt failed: $_"
                if ($attempt -lt 3) {
                  Start-Sleep -Seconds 5
                }
              }
            }

            if (-not $success) {
              throw "Tectonic $($mode.Name) prewarm failed after three attempts"
            }
          }

          Remove-Item Env:TECTONIC_CACHE_DIR -ErrorAction SilentlyContinue
      - name: Run native E2E lane (${{ matrix.lane }})
        env:
          MODUTEX_TEST_PERIODIC_WATCH: ${{ matrix.lane == 'compile-config' && '1' || '0' }}
        run: |
          node ${{ matrix.script }}
          if ($LASTEXITCODE -ne 0) { throw "Native ${{ matrix.lane }} E2E failed with exit code $LASTEXITCODE" }
      - name: Remove temporary WebView2 CDP policy and profile
        if: always() && steps.webview2-cdp-policy.outcome != 'skipped'
        run: pwsh -NoProfile -File tests/scripts/helpers/webview2-cdp-policy.ps1 -Action Cleanup
      - name: Upload native E2E evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ModuTeX-Tauri-Native-E2E-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .verification-artifacts/tauri/*-e2e.*
            .verification-artifacts/tauri/tectonic-prewarm-*.log
          if-no-files-found: warn
