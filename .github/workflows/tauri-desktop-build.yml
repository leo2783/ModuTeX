name: Tauri CI - Desktop executable build
on:
  workflow_call:
    inputs:
      checkout_ref:
        description: Validated full source commit SHA from source admission.
        required: true
        type: string
      package_version:
        description: Package version verified by source admission.
        required: true
        type: string
    outputs:
      built_exe_sha256:
        description: Built release executable SHA256
        value: ${{ jobs.desktop-build.outputs.built_exe_sha256 }}
      built_exe_artifact_id:
        description: Workflow artifact ID for the release executable
        value: ${{ jobs.desktop-build.outputs.built_exe_artifact_id }}
      built_exe_artifact_name:
        description: Workflow artifact name for the release executable
        value: ${{ jobs.desktop-build.outputs.built_exe_artifact_name }}
      built_exe_artifact_run_id:
        description: Workflow run ID containing the release executable artifact
        value: ${{ jobs.desktop-build.outputs.built_exe_artifact_run_id }}
      built_exe_artifact_digest:
        description: SHA256 digest of the uploaded executable artifact
        value: ${{ jobs.desktop-build.outputs.built_exe_artifact_digest }}
      built_exe_workflow_sha:
        description: Workflow run source SHA containing the executable artifact
        value: ${{ jobs.desktop-build.outputs.built_exe_workflow_sha }}
      built_exe_source_commit:
        description: Verified source commit used to build the executable
        value: ${{ jobs.desktop-build.outputs.built_exe_source_commit }}
      built_exe_package_version:
        description: Verified package version for the executable
        value: ${{ jobs.desktop-build.outputs.built_exe_package_version }}
permissions:
  actions: read
  contents: read
defaults:
  run:
    shell: pwsh
jobs:
  desktop-build:
    name: Build and attest Windows desktop executable
    runs-on: windows-2025
    outputs:
      built_exe_sha256: ${{ steps.exe_identity.outputs.sha256 }}
      built_exe_artifact_id: ${{ steps.upload_release_exe.outputs.artifact-id }}
      built_exe_artifact_name: ${{ steps.exe_identity.outputs.artifact_name }}
      built_exe_artifact_run_id: ${{ steps.exe_identity.outputs.run_id }}
      built_exe_artifact_digest: ${{ steps.upload_release_exe.outputs.artifact-digest }}
      built_exe_workflow_sha: ${{ steps.exe_identity.outputs.workflow_sha }}
      built_exe_source_commit: ${{ steps.exe_identity.outputs.source_commit }}
      built_exe_package_version: ${{ steps.exe_identity.outputs.package_version }}
    steps:
      - name: Checkout verified source commit
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ inputs.checkout_ref }}
          persist-credentials: false
          fetch-depth: 1
      - name: Setup Node.js 24.19.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Verify Node and npm runtime versions
        run: |
          if ((node --version) -ne 'v24.19.0') { throw 'Node.js 24.19.0 required' }
          if ((npm --version) -ne '11.17.0') { throw 'npm 11.17.0 required' }
      - name: Install locked build dependencies
        run: npm ci --ignore-scripts
      - name: Remove any pre-existing Tauri frontend output
        run: |
          $dist = 'apps/frontend/dist-tauri'
          if (Test-Path -LiteralPath $dist) { Remove-Item -LiteralPath $dist -Recurse -Force }
      - name: Download frontend assets built for this run
        env:
          GH_TOKEN: ${{ github.token }}
          FRONTEND_ARTIFACT_NAME: ModuTeX-Tauri-Frontend-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          gh run download $env:GITHUB_RUN_ID --name $env:FRONTEND_ARTIFACT_NAME --dir .
          if ($LASTEXITCODE -ne 0) { throw "Failed to download frontend artifact $env:FRONTEND_ARTIFACT_NAME" }
      - name: Verify downloaded Tauri frontend assets and notices
        run: |
          $dist = 'apps/frontend/dist-tauri'
          if (-not (Test-Path -LiteralPath $dist -PathType Container)) {
            throw 'Frontend build artifact did not contain apps/frontend/dist-tauri'
          }
          $frontendFiles = @(Get-ChildItem -LiteralPath $dist -File -Recurse)
          if ($frontendFiles.Count -eq 0) { throw 'Frontend build artifact is empty' }
          $required = @(
            'LICENSE',
            'NOTICE',
            'apps/frontend/LICENSE',
            'apps/frontend/NOTICE',
            'apps/frontend/THIRD_PARTY_NOTICES.md',
            'packages/frontend-contracts/LICENSE',
            'vendor/notices/TECTONIC-LICENSE.txt',
            'vendor/notices/TECTONIC-NOTICE.md'
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required frontend build artifact notice missing: $path"
            }
            if ((Get-Item -LiteralPath $path).Length -le 0) {
              throw "Required frontend build artifact notice is empty: $path"
            }
          }
      - name: Install Rust toolchain 1.97.1
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw "Rust toolchain installation failed with exit code $LASTEXITCODE" }
          rustup default 1.97.1-x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw "Rust toolchain selection failed with exit code $LASTEXITCODE" }
      - name: Verify Rust toolchain versions
        run: |
          $rustcVer = rustc --version
          if ($LASTEXITCODE -ne 0) { throw 'rustc is unavailable' }
          if ($rustcVer -notmatch 'rustc 1\.97\.1') { throw "rustc 1.97.1 required, got $rustcVer" }
          $cargoVer = cargo --version
          if ($LASTEXITCODE -ne 0) { throw 'cargo is unavailable' }
          if ($cargoVer -notmatch 'cargo 1\.97\.1') { throw "cargo 1.97.1 required, got $cargoVer" }
      - name: Remove stale executable output
        run: |
          $exe = 'apps/desktop-tauri/target/x86_64-pc-windows-msvc/release/modutex-desktop-tauri.exe'
          if (Test-Path -LiteralPath $exe) { Remove-Item -LiteralPath $exe -Force }
      - name: Build Windows x64 release executable
        run: cargo build --manifest-path apps/desktop-tauri/Cargo.toml --locked --release --target x86_64-pc-windows-msvc
      - name: Verify executable and capture tested build identity
        id: exe_identity
        env:
          EXPECTED_SOURCE_COMMIT: ${{ inputs.checkout_ref }}
          EXPECTED_PACKAGE_VERSION: ${{ inputs.package_version }}
          WORKFLOW_SHA: ${{ github.sha }}
          CI_RUN_ID: ${{ github.run_id }}
        run: >
          $commit = (git rev-parse HEAD).Trim()

          if ($LASTEXITCODE -ne 0) { throw 'Source revision unavailable' }

          if ($commit -ne $env:EXPECTED_SOURCE_COMMIT) { throw 'Desktop build checked out an unexpected source commit' }

          if ($env:EXPECTED_PACKAGE_VERSION -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(?:-[A-Za-z0-9.]+)?$') { throw 'Verified
          package version is invalid' }

          if ($env:WORKFLOW_SHA -notmatch '^[0-9a-f]{40}$') { throw 'Workflow source SHA is invalid' }

          $exe = 'apps/desktop-tauri/target/x86_64-pc-windows-msvc/release/modutex-desktop-tauri.exe'

          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "Freshly built release binary not found at $exe"
          }

          $item = Get-Item -LiteralPath $exe

          if ($item.Length -le 0) { throw 'Built release executable is empty' }

          $sha256 = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()

          if (-not $sha256 -or $sha256 -eq 'none') { throw 'Failed to compute executable SHA-256' }

          "sha256=$sha256" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          'artifact_name=ModuTeX-Release-Executable' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          "run_id=$env:CI_RUN_ID" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          "workflow_sha=$env:WORKFLOW_SHA" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          "source_commit=$commit" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          "package_version=$env:EXPECTED_PACKAGE_VERSION" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Upload immutable release executable artifact
        id: upload_release_exe
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: ModuTeX-Release-Executable
          path: apps/desktop-tauri/target/x86_64-pc-windows-msvc/release/modutex-desktop-tauri.exe
          if-no-files-found: error
