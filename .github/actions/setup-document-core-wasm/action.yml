name: Set up document-core WASM toolchain
description: Install the pinned Rust toolchain, WebAssembly target, and wasm-bindgen CLI.
runs:
  using: composite
  steps:
    - name: Install pinned Rust and wasm-bindgen on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        rustup toolchain install 1.97.1 --profile minimal --target x86_64-pc-windows-msvc
        if ($LASTEXITCODE -ne 0) { throw "Rust toolchain installation failed with exit code $LASTEXITCODE" }
        rustup default 1.97.1-x86_64-pc-windows-msvc
        if ($LASTEXITCODE -ne 0) { throw "Rust toolchain selection failed with exit code $LASTEXITCODE" }
        rustup target add wasm32-unknown-unknown --toolchain 1.97.1-x86_64-pc-windows-msvc
        if ($LASTEXITCODE -ne 0) { throw "WebAssembly target installation failed with exit code $LASTEXITCODE" }
        cargo install wasm-bindgen-cli --version 0.2.126 --locked
        if ($LASTEXITCODE -ne 0) { throw "wasm-bindgen CLI installation failed with exit code $LASTEXITCODE" }
        $rustcVersion = rustc --version
        if ($LASTEXITCODE -ne 0 -or $rustcVersion -notmatch '^rustc 1\.97\.1(?:\s|$)') {
          throw "Rust 1.97.1 is required, got '$rustcVersion'"
        }
        $cargoVersion = cargo --version
        if ($LASTEXITCODE -ne 0 -or $cargoVersion -notmatch '^cargo 1\.97\.1(?:\s|$)') {
          throw "Cargo 1.97.1 is required, got '$cargoVersion'"
        }
        $wasmBindgenVersion = wasm-bindgen --version
        if ($LASTEXITCODE -ne 0 -or $wasmBindgenVersion -ne 'wasm-bindgen 0.2.126') {
          throw "wasm-bindgen 0.2.126 is required, got '$wasmBindgenVersion'"
        }
    - name: Install pinned Rust and wasm-bindgen on Linux
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        rustup toolchain install 1.97.1 --profile minimal --target wasm32-unknown-unknown
        rustup default 1.97.1
        rustup target add wasm32-unknown-unknown --toolchain 1.97.1
        cargo install wasm-bindgen-cli --version 0.2.126 --locked
        rustc_version="$(rustc --version)"
        case "$rustc_version" in
          "rustc 1.97.1"*) ;;
          *) printf 'Rust 1.97.1 is required, got %s\n' "$rustc_version" >&2; exit 1 ;;
        esac
        cargo_version="$(cargo --version)"
        case "$cargo_version" in
          "cargo 1.97.1"*) ;;
          *) printf 'Cargo 1.97.1 is required, got %s\n' "$cargo_version" >&2; exit 1 ;;
        esac
        wasm_bindgen_version="$(wasm-bindgen --version)"
        if [ "$wasm_bindgen_version" != 'wasm-bindgen 0.2.126' ]; then
          printf 'wasm-bindgen 0.2.126 is required, got %s\n' "$wasm_bindgen_version" >&2
          exit 1
        fi
